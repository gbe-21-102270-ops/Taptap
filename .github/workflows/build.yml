                      android:lineSpacingExtra="5dp"
                      android:text="떠 있는 버튼을 짧게 탭하면\n• 📖 → 홈으로 나간 뒤 네이버 영어사전\n• 🧹 → 열려 있는 앱 모두 닫기\n• 📷 → 인스타그램 열기\n\n📖 과 🧹 를 동시에 누르면 화면이 꺼진 것처럼 됩니다.\n해제는 화면을 3초간 꾹 누르기.\n\n꾹 눌러 끌면 버튼 위치를 옮길 수 있습니다." />

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="24dp"
                      android:background="#33888888" />

                  <TextView
