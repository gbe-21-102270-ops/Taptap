name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/taptap app/src/main/res/layout app/src/main/res/values app/src/main/res/xml
          cat > app/build.gradle.kts << 'TAPTAP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.taptap"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.taptap"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          TAPTAP_EOF
          cat > app/src/main/AndroidManifest.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TapTap">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="@string/service_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_config" />
                  </service>

              </application>
          </manifest>
          TAPTAP_EOF
          cat > app/src/main/java/com/example/taptap/MainActivity.kt << 'TAPTAP_EOF'
          package com.example.taptap

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  status = findViewById(R.id.status)

                  findViewById<Button>(R.id.btnOpenSettings).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (isServiceEnabled())
                      "✅ 켜져 있습니다"
                  else
                      "⚠️ 꺼져 있습니다\n아래 버튼 → 설치된 앱 → TapTap 제스처 켜기"
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.contains("$packageName/$packageName.TapService")
              }
          }
          TAPTAP_EOF
          cat > app/src/main/java/com/example/taptap/TapService.kt << 'TAPTAP_EOF'
          package com.example.taptap

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          class TapService : AccessibilityService() {

              companion object {
                  // 오른쪽 가장자리 감지 띠의 폭(dp). 넓힐수록 탭이 쉽지만 앱 터치를 더 가림.
                  private const val STRIP_WIDTH_DP = 28

                  // 연속 탭으로 인정하는 간격(ms). 늘리면 천천히 탭해도 인식되지만 반응이 느려짐.
                  private const val TAP_TIMEOUT = 320L

                  private const val DICT_URL = "https://en.dict.naver.com/"
              }

              private var overlay: View? = null
              private var tapCount = 0
              private val handler = Handler(Looper.getMainLooper())

              private val runnable = Runnable {
                  when (tapCount) {
                      2 -> openEnDict()
                      3 -> performGlobalAction(GLOBAL_ACTION_BACK)
                  }
                  tapCount = 0
              }

              override fun onServiceConnected() {
                  if (overlay != null) return

                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val widthPx = (STRIP_WIDTH_DP * resources.displayMetrics.density).toInt()

                  val params = WindowManager.LayoutParams(
                      widthPx,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.END or Gravity.TOP

                  val view = View(this)
                  view.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_DOWN) {
                          tapCount++
                          handler.removeCallbacks(runnable)
                          handler.postDelayed(runnable, TAP_TIMEOUT)
                      }
                      true
                  }

                  overlay = view
                  wm.addView(view, params)
              }

              private fun openEnDict() {
                  val uri = Uri.parse(DICT_URL)

                  // 1순위: 크롬으로 열기
                  val chrome = Intent(Intent.ACTION_VIEW, uri).apply {
                      setPackage("com.android.chrome")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try {
                      startActivity(chrome)
                      return
                  } catch (_: Exception) {
                  }

                  // 2순위: 기본 브라우저로 열기
                  try {
                      startActivity(
                          Intent(Intent.ACTION_VIEW, uri)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (_: Exception) {
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(runnable)
                  overlay?.let { v ->
                      try {
                          (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(v)
                      } catch (_: Exception) {
                      }
                  }
                  overlay = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}
          }
          TAPTAP_EOF
          cat > app/src/main/res/layout/activity_main.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="TapTap"
                  android:textSize="32sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:text="상태 확인 중..." />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:textSize="15sp"
                  android:gravity="center"
                  android:lineSpacingExtra="6dp"
                  android:text="화면 오른쪽 가장자리 띠를\n\n• 2번 탭 → 네이버 영어사전\n• 3번 탭 → 뒤로가기" />

              <Button
                  android:id="@+id/btnOpenSettings"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="32dp"
                  android:text="접근성 설정 열기" />

          </LinearLayout>
          TAPTAP_EOF
          cat > app/src/main/res/values/strings.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">TapTap</string>
              <string name="service_name">TapTap 제스처</string>
              <string name="service_desc">화면 오른쪽 가장자리를 두 번 탭하면 네이버 영어사전, 세 번 탭하면 뒤로가기를 실행합니다.</string>
          </resources>
          TAPTAP_EOF
          cat > app/src/main/res/values/themes.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TapTap" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          TAPTAP_EOF
          cat > app/src/main/res/xml/tap_config.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          TAPTAP_EOF
          cat > build.gradle.kts << 'TAPTAP_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          TAPTAP_EOF
          cat > gradle.properties << 'TAPTAP_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          TAPTAP_EOF
          cat > settings.gradle.kts << 'TAPTAP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TapTap"
          include(":app")
          TAPTAP_EOF
          ls -R

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TapTap build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
