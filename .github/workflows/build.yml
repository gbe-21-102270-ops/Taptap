                      android:text="🧹 모두 닫기 버튼 표시" />

                  <CheckBox
                      android:id="@+id/instaBox"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📷 인스타그램 버튼 표시" />

                  <CheckBox
                      android:id="@+id/flatBox"
