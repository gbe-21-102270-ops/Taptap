          TAPTAP_EOF
          cat > build.gradle.kts << 'TAPTAP_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          TAPTAP_EOF
          cat > gradle.properties << 'TAPTAP_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          TAPTAP_EOF
          cat > settings.gradle.kts << 'TAPTAP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TapTap"
          include(":app")
          TAPTAP_EOF
          cat > taptap.jks.b64 << 'TAPTAP_EOF'
          
          TAPTAP_EOF
          base64 -d taptap.jks.b64 > taptap.jks

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TapTap-v4.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TapTap v4 (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/*.apk
