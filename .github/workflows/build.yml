name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/taptap app/src/main/res/layout app/src/main/res/values app/src/main/res/xml
          cat > app/build.gradle.kts << 'TAPTAP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.taptap"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.taptap"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              signingConfigs {
                  create("fixed") {
                      storeFile = rootProject.file("taptap.jks")
                      storePassword = "taptap123"
                      keyAlias = "taptap"
                      keyPassword = "taptap123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("fixed")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("fixed")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          TAPTAP_EOF
          cat > app/src/main/AndroidManifest.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TapTap">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="@string/service_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_config" />
                  </service>

              </application>
          </manifest>
          TAPTAP_EOF
          cat > app/src/main/java/com/example/taptap/MainActivity.kt << 'TAPTAP_EOF'
          package com.example.taptap

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var status: TextView
              private lateinit var sizeLabel: TextView
              private lateinit var alphaLabel: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences(TapService.PREFS, Context.MODE_PRIVATE)

                  status = findViewById(R.id.status)
                  findViewById<TextView>(R.id.verLabel).text =
                      "버전 " + packageManager.getPackageInfo(packageName, 0).versionName
                  sizeLabel = findViewById(R.id.sizeLabel)
                  alphaLabel = findViewById(R.id.alphaLabel)

                  val sizeBar = findViewById<SeekBar>(R.id.sizeBar)
                  val alphaBar = findViewById<SeekBar>(R.id.alphaBar)
                  val vibrateBox = findViewById<CheckBox>(R.id.vibrateBox)
                  val recentsBox = findViewById<CheckBox>(R.id.recentsBox)
                  val instaBox = findViewById<CheckBox>(R.id.instaBox)
                  val flatBox = findViewById<CheckBox>(R.id.flatBox)
                  val dndBox = findViewById<CheckBox>(R.id.dndBox)

                  // 크기: 40 ~ 100 dp
                  val size = prefs.getInt(TapService.KEY_SIZE, TapService.DEF_SIZE)
                  sizeBar.max = 60
                  sizeBar.progress = size - 40
                  showSize(size)

                  // 투명도: 20 ~ 100 %
                  val alpha = prefs.getInt(TapService.KEY_ALPHA, TapService.DEF_ALPHA)
                  alphaBar.max = 90
                  alphaBar.progress = (alpha - 10).coerceAtLeast(0)
                  showAlpha(alpha)

                  vibrateBox.isChecked = prefs.getBoolean(TapService.KEY_VIBRATE, TapService.DEF_VIBRATE)
                  recentsBox.isChecked =
                      prefs.getBoolean(TapService.KEY_SHOW_RECENTS, TapService.DEF_SHOW_RECENTS)
                  instaBox.isChecked =
                      prefs.getBoolean(TapService.KEY_SHOW_INSTA, TapService.DEF_SHOW_INSTA)
                  flatBox.isChecked = prefs.getBoolean(TapService.KEY_FLAT, TapService.DEF_FLAT)
                  dndBox.isChecked = prefs.getBoolean(TapService.KEY_DND, TapService.DEF_DND)

                  sizeBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) = showSize(p + 40)
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          prefs.edit().putInt(TapService.KEY_SIZE, (sb?.progress ?: 0) + 40).apply()
                      }
                  })

                  alphaBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) = showAlpha(p + 10)
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          prefs.edit().putInt(TapService.KEY_ALPHA, (sb?.progress ?: 0) + 10).apply()
                      }
                  })

                  vibrateBox.setOnCheckedChangeListener { _, c ->
                      prefs.edit().putBoolean(TapService.KEY_VIBRATE, c).apply()
                  }
                  recentsBox.setOnCheckedChangeListener { _, c ->
                      prefs.edit().putBoolean(TapService.KEY_SHOW_RECENTS, c).apply()
                  }
                  instaBox.setOnCheckedChangeListener { _, c ->
                      prefs.edit().putBoolean(TapService.KEY_SHOW_INSTA, c).apply()
                  }
                  flatBox.setOnCheckedChangeListener { _, c ->
                      prefs.edit().putBoolean(TapService.KEY_FLAT, c).apply()
                  }
                  dndBox.setOnCheckedChangeListener { _, c ->
                      prefs.edit().putBoolean(TapService.KEY_DND, c).apply()
                  }

                  findViewById<Button>(R.id.btnOpenSettings).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  findViewById<Button>(R.id.btnDndPerm).setOnClickListener {
                      try {
                          startActivity(
                              Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)
                          )
                      } catch (e: Exception) {
                          status.text = "이 기기에서는 권한 화면을 열 수 없습니다"
                      }
                  }

                  findViewById<Button>(R.id.btnResetPos).setOnClickListener {
                      prefs.edit().remove(TapService.KEY_X).remove(TapService.KEY_Y).apply()
                      prefs.edit().putInt(TapService.KEY_SIZE,
                          prefs.getInt(TapService.KEY_SIZE, TapService.DEF_SIZE)).apply()
                      status.text = "버튼 위치를 오른쪽 아래로 되돌렸습니다"
                  }
              }

              private fun showSize(dp: Int) {
                  sizeLabel.text = "버튼 크기: ${dp}dp"
              }

              private fun showAlpha(pct: Int) {
                  alphaLabel.text = "버튼 진하기: ${pct}%"
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (isServiceEnabled())
                      "✅ 켜져 있습니다"
                  else
                      "⚠️ 꺼져 있습니다 — 아래 버튼을 눌러 켜주세요"
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.contains("$packageName/$packageName.TapService")
              }
          }
          TAPTAP_EOF
          cat > app/src/main/java/com/example/taptap/TapService.kt << 'TAPTAP_EOF'
          package com.example.taptap

          import android.accessibilityservice.AccessibilityService
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class TapService : AccessibilityService() {

              companion object {
                  const val PREFS = "taptap_prefs"
                  const val KEY_SIZE = "button_size_dp"
                  const val KEY_ALPHA = "button_alpha"
                  const val KEY_VIBRATE = "vibrate"
                  const val KEY_SHOW_RECENTS = "show_recents"
                  const val KEY_SHOW_INSTA = "show_insta"
                  const val KEY_FLAT = "flat_button"
                  const val KEY_DND = "block_noti"
                  const val KEY_X = "pos_x"
                  const val KEY_Y = "pos_y"

                  const val DEF_SIZE = 56
                  const val DEF_ALPHA = 70
                  const val DEF_VIBRATE = true
                  const val DEF_SHOW_RECENTS = true
                  const val DEF_SHOW_INSTA = true
                  const val DEF_FLAT = false
                  const val DEF_DND = true

                  private const val DICT_URL = "https://en.dict.naver.com/"
                  private const val INSTA_URL = "https://www.instagram.com/"

                  private const val COMBO_WINDOW = 900L      // 동시 누름 인정 시간
                  private const val UNLOCK_HOLD = 3000L      // 해제까지 누르는 시간
                  private const val AUTO_EXIT = 15 * 60_000L // 안전장치: 자동 해제
              }

              private var panel: LinearLayout? = null
              private var blackout: View? = null
              private lateinit var prefs: SharedPreferences
              private lateinit var wm: WindowManager
              private var params: WindowManager.LayoutParams? = null
              private val handler = Handler(Looper.getMainLooper())

              private var savedFilter = -1
              private var dictDownAt = 0L
              private var cleanDownAt = 0L
              private var comboFired = false

              private val prefListener =
                  SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                      if (key != KEY_X && key != KEY_Y) rebuild()
                  }

              override fun onServiceConnected() {
                  prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  rebuild()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // ---------- 떠 있는 버튼들 ----------

              private fun rebuild() {
                  panel?.let {
                      try {
                          wm.removeView(it)
                      } catch (_: Exception) {
                      }
                  }
                  panel = null

                  val sizeDp = prefs.getInt(KEY_SIZE, DEF_SIZE)
                  val sizePx = dp(sizeDp)
                  val alphaPct = prefs.getInt(KEY_ALPHA, DEF_ALPHA)
                  val showRecents = prefs.getBoolean(KEY_SHOW_RECENTS, DEF_SHOW_RECENTS)
                  val showInsta = prefs.getBoolean(KEY_SHOW_INSTA, DEF_SHOW_INSTA)

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      alpha = alphaPct / 100f
                  }

                  var count = 1
                  val dict = makeCircle("📖", "#2E7D32", sizeDp, sizePx, "dict") {
                      buzz(35)
                      goToDictionary()
                  }
                  container.addView(dict)

                  if (showRecents) {
                      val clean = makeCircle("🧹", "#C62828", sizeDp, sizePx, "clean") {
                          buzz(35)
                          closeAllApps()
                      }
                      (clean.layoutParams as LinearLayout.LayoutParams).topMargin = dp(10)
                      container.addView(clean)
                      count++
                  }

                  if (showInsta) {
                      val insta = makeCircle("📷", "#6A1B9A", sizeDp, sizePx, "insta") {
                          buzz(35)
                          openInstagram()
                      }
                      (insta.layoutParams as LinearLayout.LayoutParams).topMargin = dp(10)
                      container.addView(insta)
                      count++
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START

                  val dm = resources.displayMetrics
                  val stack = sizePx * count + dp(10) * (count - 1)
                  lp.x = prefs.getInt(KEY_X, dm.widthPixels - sizePx - dp(16))
                  lp.y = prefs.getInt(KEY_Y, dm.heightPixels - stack - dp(120))

                  params = lp
                  panel = container
                  try {
                      wm.addView(container, lp)
                  } catch (_: Exception) {
                  }
              }

              private fun makeCircle(
                  emoji: String,
                  color: String,
                  sizeDp: Int,
                  sizePx: Int,
                  tag: String,
                  onTap: () -> Unit
              ): View {
                  val tv = TextView(this).apply {
                      text = emoji
                      textSize = sizeDp * 0.42f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      if (prefs.getBoolean(KEY_FLAT, DEF_FLAT)) {
                          background = null
                          setShadowLayer(dp(3).toFloat(), 0f, 0f, Color.parseColor("#88000000"))
                      } else {
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(Color.parseColor(color))
                              setStroke(dp(2), Color.parseColor("#66FFFFFF"))
                          }
                          elevation = dp(6).toFloat()
                      }
                      layoutParams = LinearLayout.LayoutParams(sizePx, sizePx)
                  }
                  attachTouch(tv, tag, onTap)
                  return tv
              }

              private fun attachTouch(view: View, tag: String, onTap: () -> Unit) {
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var downTime = 0L
                  var moved = false

                  view.setOnTouchListener { v, e ->
                      val lp = params ?: return@setOnTouchListener false
                      val root = panel ?: return@setOnTouchListener false
                      val now = System.currentTimeMillis()

                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x
                              startY = lp.y
                              touchX = e.rawX
                              touchY = e.rawY
                              downTime = now
                              moved = false
                              v.animate().scaleX(0.88f).scaleY(0.88f).setDuration(80).start()

                              if (tag == "dict") dictDownAt = now
                              if (tag == "clean") cleanDownAt = now

                              // 📖 + 🧹 동시 누름 → 화면 끄기
                              if (dictDownAt > 0 && cleanDownAt > 0 &&
                                  abs(dictDownAt - cleanDownAt) < COMBO_WINDOW && !comboFired
                              ) {
                                  comboFired = true
                                  buzz(120)
                                  handler.postDelayed({ showBlackout() }, 150)
                              }
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > dp(8) || abs(dy) > dp(8)) moved = true
                              if (moved && !comboFired) {
                                  lp.x = startX + dx
                                  lp.y = startY + dy
                                  try {
                                      wm.updateViewLayout(root, lp)
                                  } catch (_: Exception) {
                                  }
                              }
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.animate().scaleX(1f).scaleY(1f).setDuration(80).start()

                              if (tag == "dict") dictDownAt = 0
                              if (tag == "clean") cleanDownAt = 0

                              if (comboFired) {
                                  if (dictDownAt == 0L && cleanDownAt == 0L) comboFired = false
                              } else if (moved) {
                                  prefs.edit().putInt(KEY_X, lp.x).putInt(KEY_Y, lp.y).apply()
                              } else if (now - downTime < 600) {
                                  onTap()
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              // ---------- 가짜 화면 끄기 ----------

              private fun showBlackout() {
                  if (blackout != null) return

                  panel?.visibility = View.GONE

                  val frame = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }

                  val hint = TextView(this).apply {
                      text = "3초 길게 누르면 해제"
                      setTextColor(Color.parseColor("#33FFFFFF"))
                      textSize = 13f
                      gravity = Gravity.CENTER
                  }
                  frame.addView(
                      hint,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                  )
                  hint.animate().alpha(0f).setStartDelay(2000).setDuration(1200).start()

                  var holdX = 0f
                  var holdY = 0f
                  val unlock = Runnable { hideBlackout() }

                  frame.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              holdX = e.rawX
                              holdY = e.rawY
                              handler.postDelayed(unlock, UNLOCK_HOLD)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (abs(e.rawX - holdX) > dp(40) || abs(e.rawY - holdY) > dp(40)) {
                                  handler.removeCallbacks(unlock)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(unlock)
                          }
                      }
                      true
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.OPAQUE
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.screenBrightness = 0.02f

                  startDnd()

                  blackout = frame
                  try {
                      wm.addView(frame, lp)
                  } catch (_: Exception) {
                      blackout = null
                      stopDnd()
                      panel?.visibility = View.VISIBLE
                      return
                  }

                  // 안전장치: 오래 두면 저절로 풀림
                  handler.postDelayed({ hideBlackout() }, AUTO_EXIT)
              }

              private fun hideBlackout() {
                  val b = blackout ?: return
                  blackout = null
                  try {
                      wm.removeView(b)
                  } catch (_: Exception) {
                  }
                  stopDnd()
                  panel?.visibility = View.VISIBLE
                  buzz(40)
              }

              private fun startDnd() {
                  if (!prefs.getBoolean(KEY_DND, DEF_DND)) return
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (!nm.isNotificationPolicyAccessGranted) return
                      savedFilter = nm.currentInterruptionFilter
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE)
                  } catch (_: Exception) {
                  }
              }

              private fun stopDnd() {
                  if (savedFilter == -1) return
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (nm.isNotificationPolicyAccessGranted) {
                          nm.setInterruptionFilter(savedFilter)
                      }
                  } catch (_: Exception) {
                  }
                  savedFilter = -1
              }

              // ---------- 각 버튼 동작 ----------

              private fun goToDictionary() {
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  handler.postDelayed({ openUrl(DICT_URL, true) }, 350)
              }

              private fun openInstagram() {
                  openUrl(INSTA_URL, false)
              }

              private fun openUrl(url: String, clearTask: Boolean) {
                  val uri = Uri.parse(url)
                  var flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  if (clearTask) {
                      flags = flags or Intent.FLAG_ACTIVITY_CLEAR_TASK or Intent.FLAG_ACTIVITY_NO_HISTORY
                  }

                  val chrome = Intent(Intent.ACTION_VIEW, uri).apply {
                      setPackage("com.android.chrome")
                      addFlags(flags)
                  }
                  try {
                      startActivity(chrome)
                      return
                  } catch (_: Exception) {
                  }

                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, uri).addFlags(flags))
                  } catch (_: Exception) {
                  }
              }

              private val clearLabels = listOf(
                  "모두 닫기", "모두 지우기", "전체 닫기", "전체 삭제", "모두 삭제",
                  "Clear all", "Close all", "CLEAR ALL"
              )

              private fun closeAllApps() {
                  performGlobalAction(GLOBAL_ACTION_RECENTS)
                  tryClear(0)
              }

              private fun tryClear(attempt: Int) {
                  if (attempt > 6) return
                  handler.postDelayed({
                      if (!clickClearButton()) {
                          tryClear(attempt + 1)
                      } else {
                          handler.postDelayed({ performGlobalAction(GLOBAL_ACTION_HOME) }, 500)
                      }
                  }, if (attempt == 0) 600 else 300)
              }

              private fun clickClearButton(): Boolean {
                  val roots = ArrayList<AccessibilityNodeInfo>()
                  try {
                      rootInActiveWindow?.let { roots.add(it) }
                      for (w in windows) {
                          w.root?.let { roots.add(it) }
                      }
                  } catch (_: Exception) {
                  }

                  for (root in roots) {
                      for (label in clearLabels) {
                          val found = try {
                              root.findAccessibilityNodeInfosByText(label)
                          } catch (_: Exception) {
                              null
                          } ?: continue
                          for (node in found) {
                              if (clickNode(node)) return true
                          }
                      }
                  }
                  return false
              }

              private fun clickNode(node: AccessibilityNodeInfo?): Boolean {
                  var n = node
                  var depth = 0
                  while (n != null && depth < 5) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                      depth++
                  }
                  return false
              }

              private fun buzz(ms: Long) {
                  if (!prefs.getBoolean(KEY_VIBRATE, DEF_VIBRATE)) return
                  try {
                      val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(ms)
                      }
                  } catch (_: Exception) {
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try {
                      prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  } catch (_: Exception) {
                  }
                  blackout?.let {
                      try {
                          wm.removeView(it)
                      } catch (_: Exception) {
                      }
                  }
                  blackout = null
                  stopDnd()
                  panel?.let {
                      try {
                          wm.removeView(it)
                      } catch (_: Exception) {
                      }
                  }
                  panel = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}
          }
          TAPTAP_EOF
          cat > app/src/main/res/layout/activity_main.xml << 'TAPTAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="28dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="TapTap"
                      android:textSize="30sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/verLabel"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
